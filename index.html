:root{
  --sans:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--serif:'Fraunces',Georgia,serif;
  --bg:#0F1A2B;--panel:#172538;--ink:#EAF0F7;--mute:#A9B8CC;--sub:#8FA2B8;--line:#26384F;--line2:#2F4562;--chip:#1F3149;
  --accent:#F2B35E;--accent-ink:#1A1206;--teal:#73D9BC;--tealink:#0B1A22;--coral:#FF9C8A;--blue:#8DB8FF;
  --me:#73D9BC;--other:#8DB8FF;--split:#F2B35E;--bad:#FF9C8A;--good:#73D9BC;--warn:#F2B35E;
  --shadow:none;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans)}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-family:var(--serif);font-weight:600}
h1{font-size:24px;letter-spacing:-.02em}h2{font-size:18px}h3{font-size:15px}
.mute{color:var(--mute)}.small{font-size:12.5px}.right{text-align:right}.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.grow{flex:1}.gap{gap:14px}
#app{display:flex;min-height:100vh}
#side{display:none}
#main{flex:1;max-width:980px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 24px;width:100%}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0C1624;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
#bar button{flex:1;background:none;border:0;color:var(--mute);font:600 11px var(--sans);padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
#bar button span{display:flex;line-height:1}#bar button{min-height:56px;justify-content:center}
#bar button.on{color:var(--accent)}
@media (min-width:860px){
  #side{display:flex;flex-direction:column;gap:4px;width:220px;padding:22px 12px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;background:var(--panel)}
  #side .brand{font-weight:800;font-size:17px;padding:4px 10px 16px;letter-spacing:-.02em}
  #side button{display:flex;gap:10px;align-items:center;background:none;border:0;color:var(--ink);text-align:left;padding:10px 12px;border-radius:10px;font:600 14px var(--sans);cursor:pointer}
  #side button:hover{background:var(--chip)}#side button.on{background:var(--chip);color:var(--accent)}
  #bar{display:none}body{padding-bottom:0}.homelock{display:none}
  #main{padding:28px 32px}
}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card.flat{box-shadow:none}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:600px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:minmax(0,1fr)}}
.grid>*{min-width:0}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa button{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 6px;font:700 13px var(--sans);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;box-shadow:var(--shadow)}
.qa button span{font-size:24px}.qa button:active{transform:scale(.97)}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}.stat small{color:var(--mute);font-weight:600}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;min-height:44px;padding:11px 18px;font:700 14px var(--sans);cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--ink);border:1px solid var(--line2)}.btn.bad{background:var(--bad);color:#2a0a05}.btn.sm{padding:8px 14px;font-size:13.5px;border-radius:12px;min-height:44px}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;font:16px var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:110px;resize:vertical}
label.f{display:block;margin:0 0 12px}label.f>span{display:block;font-weight:700;font-size:12.5px;color:var(--mute);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
label.ck{display:flex;gap:10px;align-items:center;margin:0 0 12px;font-weight:600}label.ck input{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);color:var(--ink);border:1px solid transparent;border-radius:999px;padding:6px 11px;font:600 12.5px var(--sans);cursor:pointer}
.chip{min-height:36px}.chip.on{background:rgba(115,217,188,.18);border-color:var(--teal);color:var(--ink)}
.badge{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:700;background:var(--chip);color:var(--mute)}
.badge.r{background:rgba(255,156,138,.16);color:var(--coral)}.badge.y{background:rgba(242,179,94,.16);color:var(--accent)}.badge.g{background:rgba(115,217,188,.16);color:var(--teal)}
.item{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}.item .ic{font-size:22px;width:34px;text-align:center}
.item .t{font-weight:700}.item .s{color:var(--mute);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.void{opacity:.55;text-decoration:line-through}
#sheetWrap{position:fixed;inset:0;background:rgba(5,10,18,.7);display:none;z-index:50;align-items:flex-end;justify-content:center}
#sheetWrap.on{display:flex}
#sheet{background:var(--panel);width:100%;max-width:640px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column}
@media(min-width:700px){#sheetWrap{align-items:center}#sheet{border-radius:22px;max-height:88vh}}
#sheet header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
#sheet .body{padding:4px 18px calc(20px + env(safe-area-inset-bottom));overflow:auto}
.x{background:var(--chip);border:0;border-radius:50%;width:32px;height:32px;font-size:16px;color:var(--ink);cursor:pointer}
.lint{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:-4px 0 12px;font-size:13px}
.lint .ok{color:var(--good);font-weight:700}.lint .w{margin:4px 0}.lint .w b{color:var(--warn)}
.bar{height:10px;border-radius:6px;background:var(--chip);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;font-weight:700;color:var(--mute);text-align:center;padding:4px 0}
.cal .d{aspect-ratio:1/1.05;border-radius:10px;background:var(--bg);border:1px solid var(--line);position:relative;cursor:pointer;padding:4px;font-size:12px;font-weight:700;overflow:hidden}
.cal .d.out{opacity:.35}.cal .d.today{outline:2px solid var(--accent)}
.cal .d .pl{position:absolute;left:0;right:0;bottom:0;height:5px}
.cal .d .dot{position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.cal .d .ac{position:absolute;inset:auto 4px 8px 4px;height:14px;border-radius:5px}
#lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:30px}
#lock.on{display:flex}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:200;display:none;max-width:90vw}
#reportView{position:fixed;inset:0;background:#e5e7eb;z-index:60;overflow:auto;display:none}
#reportView.on{display:block}
#reportView .tb{position:sticky;top:0;background:#0f172a;padding:10px 14px;display:flex;gap:8px;align-items:center;z-index:2}
#reportView .tb .t{color:#fff;font-weight:700;flex:1}
.paper{background:#fff;color:#111;max-width:820px;margin:16px auto;padding:44px 48px;font:13.5px/1.5 Georgia,"Times New Roman",serif;box-shadow:0 2px 20px rgba(0,0,0,.15)}
.paper h1{font-size:26px;margin-bottom:4px}.paper h2{font-size:17px;margin:26px 0 8px;border-bottom:2px solid #111;padding-bottom:4px;font-family:-apple-system,Helvetica,Arial,sans-serif}
.paper table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12.5px}.paper th,.paper td{border:1px solid #bbb;padding:5px 7px;text-align:left;vertical-align:top}.paper th{background:#f1f5f9}
.paper .ent{border:1px solid #999;border-radius:4px;padding:10px 12px;margin:10px 0;page-break-inside:avoid}

/* ---------- storage (IndexedDB) ---------- */
const DB={
  db:null,mem:null,
  open(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('IndexedDB unavailable'));setTimeout(()=>rej(new Error('Storage timed out')),4000);let r;try{r=indexedDB.open('custody-ledger',1)}catch(e){return rej(e)}
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('blobs');d.createObjectStore('ledger',{keyPath:'seq'})};
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  tx(store,mode,fn){if(this.mem)return Promise.resolve(this.memTx(store,fn));return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error)})},
  memTx(store,fn){const m=this.mem[store];const shim={put:(v,k)=>{m.set(store==='ledger'?v.seq:k,v);return {result:undefined}},clear:()=>{m.clear();return {result:undefined}}};return fn(shim)},
  get(store,k){if(this.mem)return Promise.resolve(this.mem[store].get(k));return new Promise((res,rej)=>{const r=this.db.transaction(store).objectStore(store).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  put(store,v,k){return this.tx(store,'readwrite',s=>k===undefined?s.put(v):s.put(v,k))},
  all(store){if(this.mem)return Promise.resolve([...this.mem[store].values()]);return new Promise((res,rej)=>{const r=this.db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  clear(store){return this.tx(store,'readwrite',s=>s.clear())}
};

async function saveSettings(){await DB.put('kv',SET,'settings')}
async function loadAll(){
  const s=await DB.get('kv','settings');if(s)SET={...DEFAULT_SETTINGS,...s};if(!Array.isArray(SET.qbtns))SET.qbtns=[];SET.game={on:true,sound:true,theme:'auto',...(SET.game||{})};

const head=()=>LEDGER.length?LEDGER[LEDGER.length-1].hash:'GENESIS';
let _q=Promise.resolve();
function append(op,eid,data){const run=()=>appendNow(op,eid,data);const p=_q.then(run,run);_q=p.catch(()=>{});return p}
async function appendNow(op,eid,data){
  const ev={id:uid(),seq:LEDGER.length+1,ts:new Date().toISOString(),op,eid,data,prev:head()};
  ev.hash=await sha(canon(ev));
  await Promise.race([DB.put('ledger',ev),new Promise((_,rj)=>setTimeout(()=>rj(new Error('Storage did not respond')),8000))]);
  LEDGER.push(ev);if(CHAIN_OK)CHAIN_MSG=`${LEDGER.length} records verified`;rebuild();if(op==='create'&&data&&data.kind==='support'&&data.who!=='other'){try{celebrate()}catch(e){console.error(e)}}return ev;
}
async function verifyLedgerArray(arr){
  let prev='GENESIS';
  for(const ev of arr){
    const {hash,...rest}=ev;
    if(rest.prev!==prev||await sha(canon(rest))!==hash)return {ok:false,at:ev.seq};
    prev=hash;
  }
  return {ok:true,head:prev};
}
async function verifyChain(){
  const r=await verifyLedgerArray(LEDGER);
  if(!r.ok){CHAIN_OK=false;CHAIN_MSG=`Break detected at record #${r.at}`;return false}
  CHAIN_OK=true;CHAIN_MSG=LEDGER.length?`${LEDGER.length} records verified`:'No records yet';return true;
}
function rebuild(){
  const m=new Map();
  for(const ev of LEDGER){
    if(ev.op==='create'){m.set(ev.eid,{...ev.data,id:ev.eid,created:ev.ts,seq:ev.seq,hash:ev.hash,amends:[],voided:null,att:[...(ev.data.att||[])]})}
    else if(ev.op==='amend'){const e=m.get(ev.eid);if(e){e.amends.push({ts:ev.ts,seq:ev.seq,changes:ev.data.changes,reason:ev.data.reason,added:(ev.data.addAtt||[]).length});Object.assign(e,ev.data.changes);if(ev.data.addAtt)e.att.push(...ev.data.addAtt)}}
    else if(ev.op==='void'){const e=m.get(ev.eid);if(e)e.voided={ts:ev.ts,reason:ev.data.reason,seq:ev.seq}}
  }
  ENT=[...m.values()];
  SCHEDS=ENT.filter(e=>e.kind==='schedule'&&!e.voided).sort((a,b)=>a.effective.localeCompare(b.effective)||a.seq-b.seq);
  ACT=new Map();
  ENT.filter(e=>e.kind==='day'&&!e.voided).sort((a,b)=>a.seq-b.seq).forEach(e=>ACT.set(e.date,e));
}
const entries=()=>ENT.filter(e=>e.kind!=='schedule').sort((a,b)=>(b.occurred||'').localeCompare(a.occurred||'')||b.seq-a.seq);
const live=()=>entries().filter(e=>!e.voided);

/* ---------- schedule helpers ---------- */
function planned(dk){
  let s=null;for(const x of SCHEDS){if(x.effective<=dk)s=x}
  if(!s)return '';
  const d=daysBetween(s.anchor,dk);
  const wk=s.alternate?(((Math.floor(d/7)%2)+2)%2):0;
  const dow=(dfrom(dk).getDay()+6)%7;
  return (s.weeks[wk]||[])[dow]||'';
}
const actual=dk=>ACT.get(dk)?.actual||'';
function timeStats(from,to){
  let n=0,pMe=0,aMe=0,aOther=0,aSplit=0,diff=0,logged=0,pLogged=0,unlogged=0;
  for(let k=from;k<=to;k=addDays(k,1)){
    const a=actual(k),p=planned(k);n++;
    if(a){logged++;if(a==='me')aMe++;else if(a==='other')aOther++;else aSplit++;
      if(p){pLogged++;if(p==='me')pMe++;else if(p==='split')pMe+=.5;if(p!==a)diff++}}
    else unlogged++;
  }
  const nights=aMe+aOther+aSplit;
  return {days:n,logged,unlogged,aMe,aOther,aSplit,mePct:nights?Math.round((aMe+aSplit/2)/nights*100):null,
    plannedMePct:pLogged?Math.round(pMe/pLogged*100):null,variance:diff,pLogged};
}

/* ---------- objectivity linter ---------- */
const LOADED=['crazy','insane','psycho','psychotic','liar','lying','lies','lied','stupid','idiot','moron','selfish','manipulative','manipulating','toxic','narcissist','narcissistic','abusive','pathetic','worthless','disgusting','evil','hate','bitch','asshole','jerk','unfit','irresponsible','petty','vindictive','spiteful','controlling','gaslighting','gaslight','terrible','awful','horrible','ridiculous','useless','harassing','harassment'];
const MIND=[/\b(on purpose|deliberately|purposely|intentionally)\b/i,/\bjust (wants|wanted|trying|likes)\b/i,/\b(trying|wants?) to (hurt|punish|control|manipulate|get back|spite)\b/i,/\bknows? (full well|that I)\b/i,/\bobviously\b/i,/\bclearly\b/i];
const ABS=/\b(always|never|every single time|every time|constantly|all the time|nobody|everyone)\b/i;
function lint(text){
  const out=[],t=text||'';
  if(!t.trim())return {issues:[],good:[],empty:true};
  const words=t.toLowerCase().match(/[a-z']+/g)||[];
  const hit=[...new Set(words.filter(w=>LOADED.includes(w)))];
  if(hit.length)out.push({k:'label',m:`Loaded words: “${hit.join('”, “')}”`,tip:'Describe the behavior instead (what was said or done) — judges discount labels.'});
  MIND.forEach(r=>{const m=t.match(r);if(m)out.push({k:'mind',m:`Assumes intent: “${m[0]}”`,tip:'You can’t prove what someone intended. State what happened and let the facts speak.'})});
  const ab=t.match(ABS);if(ab)out.push({k:'abs',m:`Absolute: “${ab[0]}”`,tip:'Use counts or dates (“3 of the last 4 exchanges”) — numbers are credible, absolutes aren’t.'});
  if((t.match(/!/g)||[]).length>=2)out.push({k:'emo',m:'Multiple exclamation marks',tip:'Keep the tone flat; emotion reads as bias in a record.'});
  const caps=(t.match(/\b[A-Z]{4,}\b/g)||[]);if(caps.length)out.push({k:'emo',m:`ALL CAPS: ${caps.slice(0,3).join(', ')}`,tip:'Shouting weakens a record. Lowercase it.'});
  const good=[];
  if(/\b\d{1,2}(:\d{2})?\s?(am|pm|a\.m\.|p\.m\.)\b|\b\d{1,2}:\d{2}\b/i.test(t))good.push('time stated');
  if(/["“”]/.test(t))good.push('exact words quoted');
  if(/\b(at|in|outside|inside|near)\s+(the\s+)?[A-Z][a-z]+/.test(t)||/\b(school|home|house|park|parking lot|library|police|store|restaurant)\b/i.test(t))good.push('place stated');
  if(/\b(witness|present|saw|heard)\b/i.test(t))good.push('witness mentioned');
  return {issues:out,good,empty:false};
}
function lintHTML(text){
  const r=lint(text);
  if(r.empty)return '<span class="mute">Objectivity check appears as you type. Facts: who, what, when, where, exact quotes.</span>';
  let h='';
  if(!r.issues.length)h+='<div class="ok">✓ Reads as factual</div>';
  r.issues.forEach(i=>h+=`<div class="w"><b>${esc(i.m)}</b><br><span class="mute">${esc(i.tip)}</span></div>`);
  if(r.good.length)h+=`<div class="mute small" style="margin-top:6px">Strong details: ${r.good.join(' · ')}</div>`;
  else h+='<div class="mute small" style="margin-top:6px">Add specifics: time, place, exact quotes, who saw it.</div>';
  return h;
}

function openSheet(title,html,after){

  $('#sheetWrap').classList.add('on');if(after)after($('#sheet'));
}
function closeSheet(){$('#sheetWrap').classList.remove('on');$('#sheet').innerHTML=''}
$('#sheetWrap').addEventListener('click',e=>{if(e.target.id==='sheetWrap')closeSheet()});

function fieldHTML(f,v){
  const val=v??f.d??'';
  if(f.t==='textarea')return `<label class="f"><span>${f.l}</span><textarea name="${f.n}" ${f.lint?'data-lint="1"':''} placeholder="${esc(f.ph||'')}">${esc(val)}</textarea></label>${f.lint?`<div class="lint" id="lint-${f.n}">${lintHTML(val)}</div>`:''}`;
  if(f.t==='select')return `<label class="f"><span>${f.l}</span><select name="${f.n}">${f.o.map(([k,l])=>`<option value="${esc(k)}" ${String(k)===String(val)?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`;
  if(f.t==='check')return `<label class="ck"><input type="checkbox" name="${f.n}" ${val?'checked':''}> ${f.l}</label>`;
  if(f.t==='datetime')return `<label class="f"><span>${f.l}</span><div class="row"><input type="datetime-local" name="${f.n}" value="${esc(val)}"><button type="button" class="btn ghost sm" data-act="nowfill" data-n="${f.n}">Now</button></div></label>`;
  if(f.t==='number')return `<label class="f"><span>${f.l}</span><input name="${f.n}" type="number" inputmode="decimal" step="0.01" value="${esc(val)}"></label>`;

}

const b64=buf=>{let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer};
async function deriveKey(pass,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function exportBackup(){
  const blobs=[];for(const b of await DB.all('blobs'))blobs.push({id:b.id,type:b.type,name:b.name,data:b64(b.data)});
  const payload={app:'custody-ledger',v:1,exportedAt:new Date().toISOString(),settings:{...SET,pin:null,salt:null},ledger:LEDGER,blobs};
  let out=JSON.stringify(payload);
  const pass=prompt('Optional: type a passphrase to encrypt this backup (AES-256). Leave blank for an unencrypted file. If you forget the passphrase the backup cannot be opened.');
  if(pass&&!hasSubtle()){toast('Encryption needs a secure (https) page; exported unencrypted.',5000);}
  if(pass&&hasSubtle()){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await deriveKey(pass,salt),new TextEncoder().encode(out));
    out=JSON.stringify({app:'custody-ledger',enc:true,salt:b64(salt),iv:b64(iv),ct:b64(ct)})}
  const blob=new Blob([out],{type:'application/json'});const name=`custody-ledger-${dkey(new Date())}${pass?'-encrypted':''}.json`;
  const file=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})&&/iPhone|iPad/.test(navigator.userAgent)){try{await navigator.share({files:[file],title:name})}catch(e){if(e.name==='AbortError')return}}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
  SET.lastBackup=new Date().toISOString();await saveSettings();toast('Backup exported');if(ROUTE==='home'||ROUTE==='settings')render();
}

async function applyImport(mode){
  const d=window._imp;
  for(const b of d.blobs||[])await DB.put('blobs',{id:b.id,type:b.type,name:b.name,data:unb64(b.data)},b.id);
  if(mode==='replace'){await DB.clear('ledger');LEDGER=d.ledger.slice().sort((a,b)=>a.seq-b.seq);for(const ev of LEDGER)await DB.put('ledger',ev);
    SET={...SET,...d.settings,pin:SET.pin,salt:SET.salt}}
  else{
    const have=new Set(LEDGER.map(e=>e.id));const prevHeads=[head(),d.ledger.length?d.ledger[d.ledger.length-1].hash:'GENESIS'];
    const all=[...LEDGER,...d.ledger.filter(e=>!have.has(e.id))].sort((a,b)=>a.ts.localeCompare(b.ts)||a.seq-b.seq);
    const added=all.length-LEDGER.length;
    await DB.clear('ledger');LEDGER=[];let prev='GENESIS';
    for(const ev of all){const n={...ev,seq:LEDGER.length+1,prev};delete n.hash;n.hash=await sha(canon(n));LEDGER.push(n);prev=n.hash}
    const mk={id:uid(),seq:LEDGER.length+1,ts:new Date().toISOString(),op:'merge',eid:null,data:{prevHeads,added},prev};mk.hash=await sha(canon(mk));LEDGER.push(mk);
    for(const ev of LEDGER)await DB.put('ledger',ev);
    if(!SET.children.length)SET.children=d.settings.children||[];if(!(SET.qbtns||[]).length)SET.qbtns=d.settings.qbtns||[];
  }
  await saveSettings();rebuild();await verifyChain();closeSheet();render();toast('Import complete');
}

function splitClauses(t){return t.split(/\s*(?:[;]|,(?!\d)|\.(?=\s)|\bthen\b|\band\b(?=\s+(?:i\s+)?(?:took|drove|picked|dropped|gave|cooked|helped|bought|paid)))\s*/i).map(s=>s.trim()).filter(s=>s.length>2)}
function classify(text){
  const t=text.trim(),l=t.toLowerCase();if(!t)return null;
  const am=l.match(/\$\s?(\d[\d,]*(?:\.\d{1,2})?)/);const amount=am?Number(am[1].replace(/,/g,'')):null;
  const who=/^(she|he|they|my ex|ex|mom|dad|mother|father)\b/.test(l)?'other':'me';
  const iSay=/^i\b/.test(l);
  const kids='son|daughter|kids?|children|child'+SET.children.map(c=>'|'+c.name.toLowerCase().replace(/[^a-z0-9 ]/g,'')).filter(x=>x!=='|').join('');
  const sup=a=>({kind:'support',pre:{action:a,who,amount,body:t}});
  if(/\b(argu(ed|ment)|fight|fought|yell(ed|ing)|scream(ed|ing)|shout(ed|ing)|blew up|heated)\b/.test(l))return {kind:'conflict',pre:{body:t}};
  if(/\b(no[- ]?show|didn'?t show|never showed|exchange|handoff|hand-off)\b/.test(l)||(/\b(late|cancel(l)?ed|denied)\b/.test(l)&&/\b(pick ?up|drop ?off|exchange|arriv|showed|came)\b/.test(l))){
    let status='completed';
    if(/no[- ]?show|didn'?t show|never showed/.test(l))status=iSay?'noshow_me':'noshow_other';
    else if(/cancel/.test(l))status=iSay?'cancelled_me':'cancelled_other';
    else if(/denied|refus/.test(l))status='denied';
    else if(/late/.test(l))status=/\bi (was|am|ran|got|arrived|came)\b[^.]*\blate\b/.test(l)?'late_me':'late_other';
    return {kind:'exchange',pre:{status,dir:/drop(ped)?[- ]?off/.test(l)?'dropoff':'pickup',body:t}};
  }
  if(amount&&/\b(gave|give|sent|venmo(ed)?|zelle(d)?|transferred|handed)\b/.test(l))return sup(/lunch/.test(l)?'Gave money (school lunch)':/\bgas\b|fuel/.test(l)?'Gave money (gas)':'Gave money (other)');
  if(amount&&/\b(paid|bought|copay|bill|tuition|fee|receipt|cost|charged)\b/.test(l)){
    const cat=/dentist|dental/.test(l)?'Dental':/doctor|pharmacy|copay|prescription|medical|urgent/.test(l)?'Medical':/clothes|shoes|jacket|coat/.test(l)?'Clothing':/school|tuition|supplies|fees?\b/.test(l)?'Education':/soccer|football|practice|lesson|team|camp/.test(l)?'Activities':/\bgas\b|fuel/.test(l)?'Transportation':/babysit|daycare|childcare/.test(l)?'Childcare':'Other';
    return {kind:'expense',pre:{amount,category:cat,paidBy:who,body:t}};
  }
  if(/dentist|dental|orthodont/.test(l))return sup('Took to dentist');
  if(/\b(doctor|pediatrician|urgent care|clinic|hospital|\ber\b)\b/.test(l))return sup('Took to doctor');
  if(/(drop(ped)?[- ]?off|drove|took|walked).{0,30}school|school drop/.test(l))return sup('School drop-off');
  if(/(pick(ed)? up|pickup|got).{0,30}school|school pick/.test(l)||new RegExp('pick(ed)? up (my )?('+kids+')\\b').test(l))return sup('School pickup');
  if(/homework|reading with|studied with/.test(l))return sup('Homework help');
  if(/\b(practice|game|lesson|recital|rehearsal|tournament|activity)\b/.test(l))return sup(/drove|took|dropp/.test(l)?'Drove to activity':'Attended game / event');
  if(/\b(cooked|made dinner|made breakfast|made lunch)\b/.test(l))return sup('Cooked meal');
  if(/\b(sick|fever|stayed home with|threw up)\b/.test(l))return sup('Cared for sick child');
  if(/\bbought\b.*\b(clothes|shoes|supplies|backpack|jacket)\b/.test(l))return sup('Bought clothes / supplies');
  if(/\b(threat|police|violat|withheld|didn'?t return|kept (him|her|them)|ignored)\b/.test(l))return {kind:'incident',pre:{body:t}};
  if(/\b(text(ed)?|email(ed)?|call(ed)?|voicemail|messag(ed|e)|replied)\b/.test(l)){

    return {kind:'comm',pre:{channel,dir:who==='other'||/\bfrom (her|him|them)\b/.test(l)?'in':'out',body:t}};
  }

}

/* ---------- record strength ---------- */
function recordStrength(){
  const today=dkey(new Date()),parts=[];
  let logged=0;for(let i=1;i<=14;i++)if(actual(addDays(today,-i)))logged++;
  parts.push({k:'days',w:30,pct:logged/14,tip:`${14-logged} of the last 14 days have no “who had the kids” entry`,act:'go',r:'calendar',btn:'Fill in days'});
  const rec=live().filter(e=>['incident','exchange','conflict','comm'].includes(e.kind)&&(e.occurred||'').slice(0,10)>=addDays(today,-60));
  const withBody=rec.filter(e=>e.body);
  if(withBody.length){const dirty=withBody.filter(e=>lint(e.body).issues.length);
    parts.push({k:'facts',w:25,pct:1-dirty.length/withBody.length,tip:`${dirty.length} recent entr${dirty.length===1?'y uses':'ies use'} loaded words, guesses about intent, or absolutes`,act:'detail',id:dirty[0]&&dirty[0].id,btn:'Review one'})}
  const ev=rec.filter(e=>e.kind==='incident'||e.kind==='conflict');
  if(ev.length){const weak=ev.filter(e=>!((e.att||[]).length||e.witnesses||e.source));
    parts.push({k:'evidence',w:25,pct:1-weak.length/ev.length,tip:`${weak.length} incident or conflict entr${weak.length===1?'y has':'ies have'} no photo, screenshot, witness or source`,act:'detail',id:weak[0]&&weak[0].id,btn:'Add support'})}
  const ds=SET.lastBackup?Math.floor((Date.now()-new Date(SET.lastBackup))/864e5):null;
  if(LEDGER.length)parts.push({k:'backup',w:20,pct:ds===null?0:Math.max(0,1-Math.max(0,ds-7)/21),tip:ds===null?'No backup yet':`Last backup ${ds} days ago`,act:'backup',btn:'Back up'});
  const W=parts.reduce((x,q)=>x+q.w,0);
  const score=W?Math.round(parts.reduce((x,q)=>x+q.w*q.pct,0)/W*100):0;
  const nudges=parts.filter(q=>q.pct<0.8).sort((a,b)=>b.w*(1-b.pct)-a.w*(1-a.pct)).slice(0,3);
  return {score,parts,nudges};
}
function rsCard(){
  if(!LEDGER.length)return '';
  const rs=recordStrength();
  return `<div class="card"><div class="row"><h3 class="grow">Record strength</h3><b style="font-size:22px">${rs.score}</b><span class="mute small">/100</span></div><div class="bar" style="margin:8px 0"><i style="width:${rs.score}%"></i></div>${rs.nudges.length?rs.nudges.map(n=>`<div class="row" style="padding:6px 0"><div class="grow small">${esc(n.tip)}</div><button class="btn ghost sm" data-act="${n.act}" ${n.r?`data-r="${n.r}"`:''} ${n.id?`data-id="${n.id}"`:''}>${n.btn}</button></div>`).join(''):'<div class="small mute">Your record is in good shape. Keep logging.</div>'}</div>`;
}

/* ---------- verify a file ---------- */
async function readBackup(file){
  let data=JSON.parse(await file.text());
  if(data.enc){const pass=prompt('Passphrase for this backup:');if(!pass)return null;
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(unb64(data.iv))},await deriveKey(pass,new Uint8Array(unb64(data.salt))),unb64(data.ct));
    data=JSON.parse(new TextDecoder().decode(pt))}
  if(data.app!=='custody-ledger')throw new Error('Not a Custody Ledger backup');
  return data;
}
async function checkBundle(data){
  const led=(data.ledger||[]).slice().sort((a,b)=>a.seq-b.seq);
  const r=await verifyLedgerArray(led);
  const blobs=new Map((data.blobs||[]).map(b=>[b.id,b]));
  const atts=[];led.forEach(ev=>{((ev.data&&ev.data.att)||[]).concat((ev.data&&ev.data.addAtt)||[]).forEach(a=>atts.push(a))});
  let okN=0,missing=0;const bad=[];
  for(const a of atts){const b=blobs.get(a.id);if(!b){missing++;continue}const hh=await shaBuf(unb64(b.data));if(hh===a.hash)okN++;else bad.push(a.name)}
  return {records:led.length,chain:r,first:led[0]&&led[0].ts,last:led.length?led[led.length-1].ts:null,head:r.ok?r.head:null,att:atts.length,okN,missing,bad,exportedAt:data.exportedAt};
}
async function verifyFile(file){
  try{
    const data=await readBackup(file);if(!data)return;
    const r=await checkBundle(data);const good=r.chain.ok&&!r.bad.length;
    openSheet('Verification result',`<div class="card flat" style="border-color:${good?'var(--good)':'var(--bad)'}"><b style="color:${good?'var(--good)':'var(--bad)'};font-size:17px">${good?'The records link up':'The records do not link up'}</b>
      <p class="small" style="margin:8px 0 0">${r.chain.ok?`All ${r.records} records link correctly. Nothing in this file was changed, removed or inserted after it was saved.`:`The links break at record #${r.chain.at}. That record, or one before it, was changed, removed or reordered after it was saved.`}</p></div>
      <table style="margin-top:10px"><tr><td class="mute small" style="padding-right:12px">First record</td><td>${r.first?fTS(r.first):'—'}</td></tr><tr><td class="mute small">Last record</td><td>${r.last?fTS(r.last):'—'}</td></tr><tr><td class="mute small">File exported</td><td>${r.exportedAt?fTS(r.exportedAt):'—'}</td></tr><tr><td class="mute small">Attachments</td><td>${r.okN} of ${r.att} match their fingerprint${r.missing?`; ${r.missing} not included in this file`:''}${r.bad.length?`; <b style="color:var(--bad)">CHANGED: ${esc(r.bad.join(', '))}</b>`:''}</td></tr></table>
      ${r.head?`<p class="small mute" style="word-break:break-all;margin-top:10px">Head hash<br>${r.head}</p>`:''}
      <p class="small mute">This shows the records in the file link up with each other. It does not prove when they were written. Record dates come from the preparer’s device clock. To show when the record existed, compare the head hash with one the preparer emailed earlier.</p>`);
  }catch(e){toast('Could not read file: '+(e.name==='OperationError'?'wrong passphrase':e.message),4000)}
}

const HM_TIPS={abs:'Use a date or a count, like “late 3 of the last 4 pickups.”',mind:'Describe what was said or done, not what you think was meant.',label:'Say what the person did or said, not a label for them.',tone:'Keep the tone flat. Strong emphasis can read as bias in a record.'};
const INTENT=/\b(?:tried|trying|attempted)\s+to\s+[a-z' ]{3,28}?(?=\s+(?:on|in|at|with|to|when|because|and|while)\b|[,.;!?]|$)/gi;
const ABS_G=/\b(always|never|every single time|every time|constantly|all the time|nobody|everyone)\b/gi;
function hmSpots(text){
  const t=String(text||''),out=[],seen=new Set();
  const add=(p,k)=>{const key=p.toLowerCase();if(seen.has(key))return;seen.add(key);out.push({phrase:p,tip:HM_TIPS[k],k})};
  let m;
  const a=new RegExp(ABS_G.source,'gi');while((m=a.exec(t)))add(m[0],'abs');
  const i=new RegExp(INTENT.source,'gi');while((m=i.exec(t)))add(m[0],'mind');
  MIND.forEach(r=>{const g=new RegExp(r.source,'gi');while((m=g.exec(t)))add(m[0],'mind')});
  const words=t.match(/[A-Za-z']+/g)||[];[...new Set(words.filter(w=>LOADED.includes(w.toLowerCase())))].forEach(w=>add(w,'label'));
  (t.match(/\b[A-Z]{4,}\b/g)||[]).slice(0,2).forEach(w=>add(w,'tone'));
  if((t.match(/!/g)||[]).length>=2)add('!!','tone');
  return out;
}
/* Rule-based scaffold. It only swaps judgments and absolutes for [brackets].
   It never adds a fact that is not in the original text. */
function hmRewrite(t){
  let s=String(t||'');
  s=s.replace(new RegExp(INTENT.source,'gi'),'[what was said or done]');
  s=s.replace(/\b(on purpose|deliberately|purposely|intentionally|obviously|clearly)\b,?\s*/gi,'');
  MIND.forEach(r=>{s=s.replace(new RegExp(r.source,'gi'),'[what was said or done]')});
  s=s.replace(new RegExp(ABS_G.source,'gi'),'[how many times, which dates]');
  s=s.replace(new RegExp('\\b('+LOADED.join('|')+')\\b','gi'),'[what was said or done]');
  s=s.replace(/!+/g,'.').replace(/\b[A-Z]{4,}\b/g,w=>w.charAt(0)+w.slice(1).toLowerCase());
  s=s.replace(/(\[what was said or done\])(\s*\1)+/g,'$1').replace(/\s{2,}/g,' ').replace(/\s+([.,;])/g,'$1').trim();
  return s;
}

async function hmPersist(){try{await DB.put('kv',HM_DRAFTS,'hmdrafts')}catch(e){console.error(e)}}
async function hmSaveDraft(quiet){
  if(!HM.text.trim()&&!HM.where)return false;
  const {files,busy,done,...d}=HM;
  HM_DRAFTS=[{...d,step:1,updated:Date.now()},...HM_DRAFTS.filter(x=>x.id!==HM.id)].slice(0,5);
  await hmPersist();if(!quiet)toast('Draft saved. Finish it tonight.');return true;
}
async function hmSave(){
  if(HM.busy)return;
  HM.busy=true;render(true);
  try{
    const att=await saveFiles(HM.files);
    const d={kind:'incident',title:shortTitle(HM.text),occurred:HM.when||lnow(),who:HM.who,severity:Number(HM.severity)||1,body:HM.text.trim(),place:HM.where,witnesses:HM.saw.trim(),childPresent:HM.present==='yes',att,hm:true};
    if(HM.source.trim())d.source=HM.source.trim();
    if(HM.response)d.response=HM.response;
    if(HM.feel.trim())d.feelings=HM.feel.trim();
    if(SET.children.length===1)d.children=[SET.children[0].id];
    await append('create',uid(),d);
    HM_DRAFTS=HM_DRAFTS.filter(x=>x.id!==HM.id);await hmPersist();
    HM.done=true;HM.busy=false;
  }catch(err){HM.busy=false;toast('Could not save: '+err.message,5000)}
  render(true);
}

/* ---------- Reply helper ---------- */
let RP={};
function rpReset(){clearInterval(window._rpT);RP={phase:'paste',msg:'',at:'',pick:0,text:'',textFor:-1,pause:true,logged:null,left:600,started:false,ready:false,copied:false,sent:false}}
rpReset();
function rpOptions(msg){
  const qs=(msg.match(/[^.!?\n]+\?/g)||[]).map(s=>s.trim()).slice(0,3);
  const hostile=lint(msg).issues.some(i=>i.k==='label'||i.k==='emo');
  const a=qs.length?'Thanks for your message. '+qs.map(q=>`Re: “${q}” [your answer].`).join(' '):'Thanks for letting me know. [Your answer in one sentence.]';
  const b='Here is what I have: [what was sent or agreed, with the date and time]. [Where it is in writing.] I am glad to keep working through the children’s schedule in writing.';
  const c=qs.length?'You can choose not to answer right now. We log the message, and you can reply later once you have the facts.':'Nothing here asks a question. We log it and move on.';
  return {hostile,qs,opts:[{id:'short',title:'Short and neutral',tags:'Brief · Friendly',text:a},{id:'facts',title:'Answer only the facts',tags:'Informative · Firm',text:b},{id:'none',title:'Do not reply',tags:'No reply needed',text:c}]};
}
const rpClock=()=>`${Math.floor(RP.left/60)}:${pad(RP.left%60)}`;
function vReply(){
  if(RP.phase==='paste')return `${flowTop('Reply helper')}
  <div class="flow-body" style="margin-top:22px">
   <div><h1 class="fh">Paste the message</h1><p class="fsub">The one you received. Nothing leaves this device, and it is saved to your record either way.</p></div>

  </div>
  <div class="foot"><div><button id="rpGo" class="cta ${RP.msg.trim()?'':'off'}" data-act="rpgo">Show reply options</button></div></div>`;
  const R=rpOptions(RP.msg);
  if(RP.textFor!==RP.pick){RP.text=R.opts[RP.pick].text;RP.textFor=RP.pick}
  const none=RP.pick===2;
  const label=none?'Log it and move on':RP.ready?'Copy reply':RP.started?`Copy unlocks in ${rpClock()}`:(RP.pause?'Copy reply in 10 minutes':'Copy reply');
  const cls=none?'':(RP.ready?'teal':(RP.started?'off':''));
  return `${flowTop('Reply helper')}
  <div class="flow-body" style="margin-top:22px">
   <div class="box" style="display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:20px"><span class="eyebrow">Message you received, today ${esc(fTime(RP.at))}</span><div class="msg">${esc(RP.msg)}</div><button class="chipbtn" style="align-self:flex-start;height:40px" data-act="rpnew">Paste a different message</button></div>
   ${R.hostile?`<div class="note amber" style="margin:0;align-items:flex-start">${ic('shield',20)}<div class="grow">This message has strong language. You do not have to match it. Answering only the logistics keeps your record calm.</div></div>`:''}
   <div><h1 class="fh" style="font-size:28px">Pick a reply, or pick none</h1><p class="fsub">Short, factual, calm. You decide what gets sent.</p></div>
   ${R.opts.map((o,i)=>`<button class="opt ${RP.pick===i?'on':''}" aria-pressed="${RP.pick===i}" data-act="rppick" data-i="${i}"><span class="h"><b>${o.title}</b><span class="dot"></span></span><span class="tg">${o.tags}</span><span class="tx">${esc(i===RP.pick&&!none?RP.text:o.text)}</span></button>`).join('')}
   ${none?'':`<label class="fld"><span>Your reply — edit it before you copy</span><textarea id="rpText" style="min-height:130px">${esc(RP.text)}</textarea><small>Fill in or delete anything in [brackets]. We never guess details.</small></label>`}
   ${none?'':`<div class="box tgl"><div class="grow"><b>Wait 10 minutes first</b><span>Replies sent after a pause are rarely regretted.</span></div><button class="sw ${RP.pause?'on':''}" aria-pressed="${RP.pause}" aria-label="Wait 10 minutes before copying" data-act="rppause"><i></i></button></div>`}

async function rpLog(choice){

function maybeGate(){
  if(!LEDGER.length||SET.gateVer===BUILD)return;
  const recent=SET.lastBackup&&(Date.now()-new Date(SET.lastBackup))<864e5;
  if(recent){SET.gateVer=BUILD;saveSettings();return}
  const g=document.createElement('div');g.id='gate';
  g.innerHTML=`<div class="gc"><span style="color:var(--accent)">${ic('shield',34)}</span><h1>One quick thing before the update</h1>
   <p>The new version does not change your saved entries. Even so, save a backup first so you always have a copy. It takes about ten seconds.</p>
   <p>If you also use the app in another place, like a browser tab and the home-screen icon, each one has its own copy. Back up in both. We will combine them into one next.</p>
   <button class="cta" style="flex:none" data-act="gateback">Save a backup now</button>
   <button class="cta line" style="flex:none" data-act="gateskip">I already have a recent backup</button></div>`;
  document.body.appendChild(g);
}

  chip:t=>t.classList.toggle('on'),
  nowfill:t=>{const el=$(`[name=${t.dataset.n}]`);el.value=lnow()},
  geo:()=>{if(!navigator.geolocation)return toast('Location unavailable');$('#geoOut').textContent='Locating…';navigator.geolocation.getCurrentPosition(p=>{window._geo={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,at:new Date().toISOString()};$('#geoOut').textContent=`${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)} (±${Math.round(p.coords.accuracy)}m)`},()=>{$('#geoOut').textContent='Permission denied'},{enableHighAccuracy:true,timeout:15000})},
  dictate:t=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return;const r=new R();r.lang=navigator.language||'en-US';r.interimResults=false;r.continuous=true;
    const ta=$('#ef textarea');$('#dictOut').textContent='Listening… tap again to stop';
    if(window._rec){window._rec.stop();window._rec=null;$('#dictOut').textContent='';return}
    r.onresult=e=>{let s='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)s+=e.results[i][0].transcript+' ';ta.value+=(ta.value&&!ta.value.endsWith(' ')?' ':'')+s;ta.dispatchEvent(new Event('input',{bubbles:true}))};
    r.onend=()=>{window._rec=null;const o=$('#dictOut');if(o)o.textContent=''};window._rec=r;r.start()},
  fkind:t=>{FILTER.kind=t.dataset.v;render()},
  cal:t=>{const d=+t.dataset.d;if(d===0)calMonth=dkey(new Date()).slice(0,7);else{const[y,m]=calMonth.split('-').map(Number);const n=new Date(y,m-1+d,1);calMonth=`${n.getFullYear()}-${pad(n.getMonth()+1)}`}render()},
  day:t=>openDay(t.dataset.date),
  install:async()=>{if(!DEFERRED)return;DEFERRED.prompt();try{await DEFERRED.userChoice}catch(e){}DEFERRED=null;render(true)},
  dismisstip:()=>{try{localStorage.setItem('cl-tip','1')}catch(e){}render(true)},
  lock:()=>{if(!SET.pin)return toast('Set a PIN in Settings first');showLock()},
  togglekey:async t=>{const e=ENT.find(x=>x.id===t.dataset.id);if(!e)return;const was=!!e.key;await append('amend',e.id,{changes:{key:!was},reason:was?'Unmarked as key entry':'Marked as key entry',addAtt:[]});closeSheet();render(true);toast(was?'Unmarked':'Marked as key entry')},
  qc:()=>{const el=$('#qc');const txt=(el&&el.value||'').trim();if(!txt)return toast('Type or say what happened');
    const parts=splitClauses(txt).map(classify);
    if(parts.length>1&&parts.every(x=>x&&x.kind==='support')){showBatch(parts);return}
    const c=classify(txt);
    if(c){openEntry(c.kind,null,c.pre);toast('Sorted as '+KINDS[c.kind].label.toLowerCase()+'. Check and save.')}
    else{window._qcText=txt;openSheet('What kind of entry is this?',`<p class="mute small" style="margin-bottom:10px">${esc(txt)}</p><div class="qa">${['incident','exchange','comm','conflict','expense','journal','support'].map(k=>`<button data-act="qcpick" data-k="${k}"><span>${KINDS[k].icon}</span>${KINDS[k].label}</button>`).join('')}</div>`)}},
  qcpick:t=>{closeSheet();openEntry(t.dataset.k,null,{body:window._qcText})},
  qcbatch:async()=>{const ps=window._batch||[];for(const q of ps){await append('create',uid(),{kind:'support',title:q.pre.action+(q.pre.amount?' · '+money(q.pre.amount):''),occurred:lnow(),action:q.pre.action,who:q.pre.who,amount:q.pre.amount,body:q.pre.body,att:[]})}closeSheet();render();toast(ps.length+' entries logged')},
  qcdict:()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Voice input is not available in this browser');const r=new R();r.lang=navigator.language||'en-US';r.interimResults=false;r.onresult=e=>{const el=$('#qc');if(el)el.value=e.results[0][0].transcript};r.onerror=()=>toast('Could not hear that');r.start();toast('Listening…')},
  rhskip:()=>{clearInterval(window._cd);const b=$('#rhCopy');if(b)b.disabled=false;const c=$('#cd');if(c)c.innerHTML='<span class="mute">Cool-down skipped.</span>'},
  verifyfile:()=>$('#verifyFileIn').click(),
  resolve:async t=>{await append('amend',t.dataset.id,{changes:{outcome:'resolved'},reason:'Marked resolved',addAtt:[]});toast('Marked resolved');render(true)},
  cftopic:t=>{CF_TOPIC=t.dataset.v;render(true)},
  setday:t=>setDay(t.dataset.date,t.dataset.val),
  rh:()=>{const txt=$('#rh').value;if(!txt.trim())return toast('Paste a message first');const b=biff(txt);
    $('#rhOut').innerHTML=`<div class="card"><h3>${b.hostile?'Hostile content detected':'Tone check'}</h3><div class="lint" style="margin-top:10px">${lintHTML(txt)}</div>
     ${b.hostile?'<p class="small">Don’t answer attacks, labels or bait. Reply only to the logistical content, and <b>log the original message</b> so the record shows it.</p>':''}
     <h3 style="margin-top:12px">BIFF draft</h3><textarea id="rhDraft" style="min-height:190px;margin-top:8px">${esc(b.draft)}</textarea><div class="row wrap" style="margin-top:8px"><button class="btn sm" id="rhCopy" data-act="rhcopy" ${b.hostile?'disabled':''}>Copy draft</button><button class="btn ghost sm" data-act="rhcheck">Re-check my edits</button></div>${b.hostile?'<div class="small" id="cd" style="margin-top:10px"></div>':''}<div class="lint" id="rhLint" style="margin-top:10px"></div></div>`;if(b.hostile)startCooldown(120)},
  rhcopy:()=>{navigator.clipboard.writeText($('#rhDraft').value);toast('Copied')},
  rhcheck:()=>{$('#rhLint').innerHTML=lintHTML($('#rhDraft').value)},
  rhlog:()=>{const txt=$('#rh').value;openEntry('comm');const ta=$('#ef textarea');ta.value=txt;ta.dispatchEvent(new Event('input',{bubbles:true}))},
  rclose:()=>{$('#reportView').classList.remove('on')},
  rprint:()=>window.print(),
  rdl:()=>{const doc=`<!doctype html><meta charset="utf-8"><title>Parenting Record</title><style>${[...document.styleSheets[0].cssRules].filter(r=>r.type===1&&r.cssText.includes('.paper')).map(r=>r.cssText).join('\n')}body{background:#fff}</style>${window._reportHTML}`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([doc],{type:'text/html'}));a.download=`parenting-record-${dkey(new Date())}.html`;a.click()},
  addkid:async()=>{const n=$('#kidName').value.trim();if(!n)return;SET.children.push({id:uid(),name:n});await saveSettings();render()},
  rmkid:async t=>{SET.children=SET.children.filter(c=>c.id!==t.dataset.id);await saveSettings();render()},
  savesched:async()=>{
    const alt=$('#schAlt').checked,weeks=[Array(7).fill(''),Array(7).fill('')];
    $$('#schedBox select').forEach(s=>{weeks[+s.dataset.wk][+s.dataset.dow]=s.value});
    if(!alt)weeks[1]=weeks[0].slice();
    await append('create',uid(),{kind:'schedule',title:'Schedule',occurred:$('#schEff').value+'T00:00',effective:$('#schEff').value,anchor:mondayOf($('#schAnchor').value),alternate:alt,weeks});
    toast('Schedule saved');render()},
  setpin:async()=>{const p=prompt('Choose a numeric PIN (4–8 digits):');if(!p||!/^\d{4,8}$/.test(p))return toast('PIN must be 4–8 digits');SET.salt=uid();SET.pin=await sha(SET.salt+p);SET.pinLen=p.length;await saveSettings();render();toast('PIN set')},
  rmpin:async()=>{SET.pin=null;SET.salt=null;await saveSettings();render()},
  backup:()=>exportBackup(),
  restore:()=>$('#restoreFile').click(),
  csv:()=>exportCSV(),
  verify:async()=>{await verifyChain();render();toast(CHAIN_MSG)},
  anchor:()=>{const body=`Custody Ledger anchor\nRecords: ${LEDGER.length}\nHead hash: ${head()}\nDevice time: ${new Date().toISOString()}`;location.href='mailto:?subject='+encodeURIComponent('Custody Ledger anchor '+dkey(new Date()))+'&body='+encodeURIComponent(body)},
  wipe:async()=>{if(!confirm('Erase ALL records, attachments and settings on this device?'))return;HM_DRAFTS=[];if(prompt('Type ERASE to confirm')!=='ERASE')return;await DB.clear('ledger');await DB.clear('blobs');await DB.clear('kv');SET={...DEFAULT_SETTINGS};LEDGER=[];rebuild();await verifyChain();render();toast('Erased')}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;e.stopPropagation();const f=ACTS[t.dataset.act];if(f)f(t,e)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.lint){const box=$('#lint-'+t.name);if(box)box.innerHTML=lintHTML(t.value)}
  if(t.id==='hmText'){HM.text=t.value;const c=$('#hmChecks');if(c)c.innerHTML=hmChecksHTML();t.classList.toggle('good',HM.applied&&!bracketCount(HM.text))}
  if(t.id==='hmWhereTxt')HM.where=t.value;
  if(t.id==='hmWhen')HM.when=t.value;
  if(t.id==='hmSaw')HM.saw=t.value;
  if(t.id==='hmSrc')HM.source=t.value;
  if(t.id==='hmFeel')HM.feel=t.value;
  if(t.id==='rpMsg'){RP.msg=t.value;const b=$('#rpGo');if(b)b.classList.toggle('off',!t.value.trim())}
  if(t.id==='rpText')RP.text=t.value;
  if(t.id==='ltNote')LT.note=t.value;
  if(t.id==='ltAmt')LT.amt=t.value;
  if(t.id==='fq'){FILTER.q=t.value;clearTimeout(window._fq);window._fq=setTimeout(()=>{render(true);const el=$('#fq');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},250)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='ftag'){FILTER.tag=t.value;render()}
  if(t.id==='ffrom'){FILTER.from=t.value;render()}
  if(t.id==='fto'){FILTER.to=t.value;render()}
  if(t.id==='gmOn'){SET.game={...SET.game,on:t.checked};saveSettings();render(true)}
  if(t.id==='gmSound'){SET.game={...SET.game,sound:t.checked};saveSettings();if(t.checked)sfx('ok')}
  if(t.id==='ltFile'&&t.files.length){LT.files=[...LT.files,...t.files];t.value='';render(true)}
  if(t.id==='hmFile'&&t.files.length){HM.files=[...HM.files,...t.files];t.value='';render(true)}
  if(t.id==='ltDate')LT.date=t.value||LT.date;
  if(t.id==='hmWhen')HM.when=t.value;
  if(t.id==='schAlt')$('#wkB').style.display=t.checked?'':'none';
  if(t.id==='restoreFile'&&t.files[0]){importBackup(t.files[0]);t.value=''}
  if(t.id==='verifyFileIn'&&t.files[0]){verifyFile(t.files[0]);t.value=''}
});
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='qc'&&e.key==='Enter'){e.preventDefault();ACTS.qc()}});
document.addEventListener('submit',async e=>{
  if(e.target.id==='qbf'){e.preventDefault();qbSave(e.target);return}
  if(e.target.id==='qbe'){e.preventDefault();const f=e.target,lab=f.elements.label.value.trim();if(!lab){toast('Give the button a name');return}
    const rec={icon:f.elements.icon.value||'check',label:lab,askChild:f.elements.askChild.checked,askDur:f.elements.askDur.checked,askAmt:f.elements.askAmt.checked,askNote:f.elements.askNote.checked,who:f.elements.who.value==='other'?'other':'me'};
    const id=f.dataset.id;
    if(id)SET.qbtns=qbList().map(b=>b.id===id?{...b,...rec}:b);else SET.qbtns=[...qbList(),{id:uid(),...rec}];
    await saveSettings();closeSheet();render(true);toast(id?'Button saved':'Button added to Home');return}
  if(e.target.id==='sf'){e.preventDefault();const f=new FormData(e.target);SET.me=f.get('me').trim()||'Me';SET.other=f.get('other').trim()||'Other parent';SET.caseNo=f.get('caseNo').trim();SET.court=f.get('court').trim();await saveSettings();toast('Saved');render()}
  if(e.target.id==='rf'){e.preventDefault();const f=new FormData(e.target);const kinds=$$('[data-chips=kinds] .chip.on',e.target).map(x=>x.dataset.v);
    const btn=$('button:not([type=button])',e.target);btn.disabled=true;btn.textContent='Building…';
    try{showReport(await buildReport({from:f.get('from'),to:f.get('to'),kinds,photos:!!f.get('photos'),voided:!!f.get('voided'),positive:!!f.get('positive'),keyOnly:!!f.get('keyOnly'),decl:!!f.get('decl')}))}
    catch(err){toast('Report failed: '+err.message)}
    btn.disabled=false;btn.textContent='Build report'}
});

/* ---------- boot ---------- */
function makeIcon(){
  if($('#touchIcon').getAttribute('href'))return;
  try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
    x.fillStyle='#0f172a';x.fillRect(0,0,180,180);x.strokeStyle='#2dd4bf';x.lineWidth=9;x.lineCap='round';
    x.beginPath();x.moveTo(90,36);x.lineTo(90,140);x.moveTo(50,140);x.lineTo(130,140);x.moveTo(40,62);x.lineTo(140,62);x.stroke();
    [[40,62],[140,62]].forEach(([a,b])=>{x.beginPath();x.moveTo(a,b);x.lineTo(a-22,b+40);x.lineTo(a+22,b+40);x.closePath();x.stroke()});
    $('#touchIcon').href=c.toDataURL('image/png')}catch(e){}
}
window.addEventListener('unhandledrejection',e=>toast('Error: '+((e.reason&&e.reason.message)||e.reason),5000));
window.addEventListener('error',e=>toast('Error: '+e.message,5000));
(async function(){
  makeIcon();
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
  try{await DB.open()}catch(e){console.error(e);DB.mem={kv:new Map(),blobs:new Map(),ledger:new Map()}}
  try{await loadAll()}catch(e){console.error(e);toast('Could not load saved data: '+e.message,6000)}
  render();showLock();maybeGate();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
})();
</script>
</body>
